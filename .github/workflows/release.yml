name: release

# Runs after the `ci` workflow finishes successfully on a push to main.
#
# 1. release-please opens or updates a "chore: release X.Y.Z" pull request. The version is derived from
#    the Conventional Commits merged since the last release, and the PR updates package.json,
#    package-lock.json and CHANGELOG.md.
# 2. Merging that pull request runs this workflow again (after CI passes on the merge commit).
#    release-please then tags vX.Y.Z and creates the GitHub release, and the `publish` job
#    publishes that exact commit to npm with provenance.
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]

permissions:
  contents: write # tags and GitHub releases
  pull-requests: write # the release pull request
  id-token: write # npm provenance

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          target-branch: main
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Authentication, in the order npm tries it:
  # 1. Trusted Publishing (OIDC): no secret needed once npmjs.com trusts this repository,
  #    workflow file (release.yml) and environment (npm). Requires npm >= 11.5.1 and Node >= 22.14.
  # 2. The optional NPM_TOKEN secret, as a fallback. (1.0.0 itself was published manually, since a
  #    package must exist before a trusted publisher can be configured.)
  publish:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest # Trusted Publishing only works on GitHub-hosted runners
    environment: npm
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          # No dependency cache in release builds: always install from the registry.

      - name: Use an npm with Trusted Publishing support (>= 11.5.1)
        run: npm install -g npm@latest && npm --version

      - name: Check that the tag matches package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v${version}" != "${{ needs.release-please.outputs.tag_name }}" ]; then
            echo "Tag ${{ needs.release-please.outputs.tag_name }} does not match package.json ${version}" >&2
            exit 1
          fi

      # Makes re-runs and manually published versions (such as 1.0.0) safe: the tag and GitHub
      # release are still created by release-please, only the npm publish is skipped.
      - name: Skip if this version is already on npm
        id: published
        run: |
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          if npm view "${name}@${version}" version >/dev/null 2>&1; then
            echo "${name}@${version} is already on npm; nothing to publish."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.published.outputs.exists != 'true'
        run: npm ci
      # `prepublishOnly` runs lint, typecheck, build and the test suite once more before publishing.
      # Provenance is automatic with Trusted Publishing; --provenance keeps it with the token too.
      - name: Publish to npm
        if: steps.published.outputs.exists != 'true'
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }} # empty once the secret is deleted; OIDC is used then
